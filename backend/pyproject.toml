[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "story-engine"
version = "0.1.0"
description = "Story Engine — screenplay ingest, story graph IR, audio + previz renderers"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "arq>=0.26",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
    "aiohttp>=3.9",
    "google-auth>=2.30",
    # Google Cloud Agent Builder's code-first surface: the Agent Development
    # Kit. Imported only by app/adapters/adk.py, and lazily, so the suite still
    # collects and passes with it absent. The seam is written against 2.x
    # module paths (google.adk.agents / .runners / .sessions / .tools), so the
    # major is pinned: a 3.0 that moves them must be a deliberate upgrade.
    "google-adk>=2.8,<3",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests that hit the real network (deselected by default)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"
