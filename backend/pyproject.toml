[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "story-engine"
version = "0.1.0"
description = "Story Engine — screenplay ingest, story graph IR, audio + previz renderers"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "arq>=0.26",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
