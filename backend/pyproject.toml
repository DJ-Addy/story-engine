[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "story-engine"
version = "0.1.0"
description = "Story Engine — screenplay ingest, story graph IR, audio + previz renderers"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "arq>=0.26",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
    "aiohttp>=3.9",
    "google-auth>=2.30",
    # Google Cloud Agent Builder's code-first surface: the Agent Development
    # Kit. Imported only by app/adapters/adk.py, and lazily, so the suite still
    # collects and passes with it absent. The seam is written against 2.x
    # module paths (google.adk.agents / .runners / .sessions / .tools), so the
    # major is pinned: a 3.0 that moves them must be a deliberate upgrade.
    "google-adk>=2.8,<3",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    # ClickHouse track: the MCP client SDK, plus the official server the stdio
    # transport launches as a child process (python -m mcp_clickhouse.main).
    # Major pinned - 2.x renamed streamablehttp_client and changed its yield arity.
    "mcp>=2.1,<3",
    "mcp-clickhouse>=0.6",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

# The demo screenplay is runtime data, not code. `include-package-data` defaults
# to true and would probably sweep it up anyway, but "probably" is not good
# enough here: the Dockerfile builds the wheel from `pip install .` over a
# context holding only pyproject.toml and `app/` (no .git, no egg-info, and
# `backend/tests` excluded by .dockerignore), so implicit collection is running
# on inputs nobody tests, and a file that misses the wheel simply does not exist
# in the container. Naming it makes inclusion a stated fact.
# tests/test_api_demo.py asserts it is readable through importlib.resources.
[tool.setuptools.package-data]
"app.demo" = ["*.fountain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests that hit the real network (deselected by default)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"
